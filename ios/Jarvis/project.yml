# XcodeGen-Spezifikation. Erzeugt Jarvis.xcodeproj:
#   brew install xcodegen && cd ios/Jarvis && xcodegen generate
name: Jarvis
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Jarvis hört zu, wenn du ihn ansprichst.
        NSSpeechRecognitionUsageDescription: Gesprochene Befehle werden in Text umgewandelt, bevorzugt direkt auf dem Gerät.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.jarvis
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_STRICT_CONCURRENCY: targeted
